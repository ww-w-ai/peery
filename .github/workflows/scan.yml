name: Scan Agent/Skill

on:
  workflow_dispatch:
    inputs:
      git_url:
        description: "Git repository URL to scan"
        required: true
        type: string
      sha:
        description: "Commit SHA to scan"
        required: true
        type: string
      callback_url:
        description: "URL to POST results to"
        required: true
        type: string

concurrency:
  group: scan-${{ github.event.inputs.git_url }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run scan
        run: npx tsx actions/run-scan.ts
        env:
          SCAN_GIT_URL: ${{ github.event.inputs.git_url }}
          SCAN_SHA: ${{ github.event.inputs.sha }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEERY_CALLBACK_SECRET: ${{ secrets.PEERY_CALLBACK_SECRET }}
